<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interclasse de Vôlei 2026</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eceff1;
    margin: 0;
    padding: 10px;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* =========================
   TÍTULO
========================= */

h1 {
    text-align: center;
    color: #1a237e;
    margin-bottom: 5px;
}

.subtitulo {
    text-align: center;
    color: #555;
    margin-top: 0;
    margin-bottom: 25px;
}

/* =========================
   TÍTULOS DAS SEÇÕES
========================= */

h2 {
    background: #1a237e;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-size: 1.15rem;
    margin-top: 25px;
}

h3 {
    margin: 0 0 12px;
    color: #1a237e;
}

/* =========================
   GRUPOS
========================= */

.grupo {
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;

    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
}

/* =========================
   JOGOS
========================= */

.jogos {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.jogo {
    background: #f8f9fa;

    border: 1px solid #ddd;
    border-radius: 8px;

    padding: 12px;
}

.jogo-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
}

.time {
    font-weight: bold;
    width: 35%;
}

.time-direita {
    text-align: right;
}

/* =========================
   PLACAR
========================= */

.placar {
    display: flex;
    align-items: center;
    gap: 6px;
}

.placar input {
    width: 55px;
    height: 40px;

    text-align: center;

    font-size: 1.1rem;
    font-weight: bold;

    border: 2px solid #ccc;
    border-radius: 6px;
}

.placar input:focus {
    border-color: #3949ab;
    outline: none;
}

.vs {
    font-weight: bold;
}

/* =========================
   STATUS
========================= */

.status {
    font-size: 0.8rem;
    margin-top: 6px;

    min-height: 15px;

    color: #777;
}

/* =========================
   CLASSIFICAÇÃO
========================= */

.classificacao {
    overflow-x: auto;
    margin-top: 15px;
}

.classificacao-titulo {
    margin-top: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;

    min-width: 600px;
}

th,
td {
    border: 1px solid #ddd;

    padding: 9px 6px;

    text-align: center;
}

th {
    background: #3949ab;
    color: white;
}

td:first-child {
    text-align: center;
    font-weight: bold;
}

td:nth-child(2) {
    text-align: left;
    font-weight: bold;
}

/* =========================
   CLASSIFICADOS
========================= */

.classificado {
    background: #69f0ae;
    font-weight: bold;
}

/* =========================
   TORCIDA
========================= */

.torcida-buttons {
    display: flex;

    justify-content: center;

    gap: 5px;

    margin-top: 5px;
}

.btn-torcida {
    border: none;

    border-radius: 6px;

    padding: 7px 12px;

    font-weight: bold;

    cursor: pointer;
}

.btn-menos {
    background: #ef5350;
    color: white;
}

.btn-mais {
    background: #43a047;
    color: white;
}

.btn-torcida:hover {
    opacity: 0.85;
}

/* =========================
   LEGENDA
========================= */

.legenda {
    font-size: 0.8rem;

    color: #555;

    margin-top: 8px;
}

/* =========================
   BOTÃO RESET
========================= */

.btn-reset {
    width: 100%;

    margin: 30px 0;

    padding: 15px;

    background: #d32f2f;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 1rem;

    font-weight: bold;

    cursor: pointer;
}

.btn-reset:hover {
    background: #b71c1c;
}

/* =========================
   CARREGAMENTO
========================= */

.carregando {
    text-align: center;

    padding: 20px;

    color: #555;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    h1 {
        font-size: 1.4rem;
    }

    .jogo-header {
        gap: 5px;
    }

    .time {
        width: 32%;

        font-size: 0.8rem;
    }

    .placar input {
        width: 48px;

        height: 38px;
    }

    table {
        font-size: 0.78rem;
    }

    th,
    td {
        padding: 7px 4px;
    }
}

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
// =========================================================
// FIREBASE (COMPAT — funciona sem servidor/localmente)
// =========================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDPmyf4FhiPC-HNw_maPv1VRIaGTzHpFEc",

    authDomain:
        "interclassequeimada.firebaseapp.com",

    projectId:
        "interclassequeimada",

    storageBucket:
        "interclassequeimada.firebasestorage.app",

    messagingSenderId:
        "366267653198",

    databaseURL:
        "https://interclassequeimada-default-rtdb.firebaseio.com",

    appId:
        "1:366267653198:web:650743ca118bc8c239771f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const rootRef = db.ref("volei_2026");

// Compatibilidade com o restante do código original
const ref = (database, path) => database.ref(path);
const set = (reference, value) => reference.set(value);
const remove = (reference) => reference.remove();
const onValue = (reference, callback, errorCallback) => reference.on("value", callback, errorCallback);

// =========================================================
// TIMES
// =========================================================

const campeonato = {

    manha: {

        "Grupo A": [
            "Garras Noturnas",
            "Imperadores do Gelo",
            "Guardas de Ferro"
        ],

        "Grupo B": [
            "Ventos Celestes",
            "Presas Prateadas",
            "Dragões Celestiais"
        ],

        "Grupo C": [
            "Plumas Reais",
            "Presas Selvagens",
            "Asas Negras"
        ],

        "Grupo D": [
            "Olhos da Noite",
            "Guardiões do Gelo",
            "Asas Imperiais"
        ]
    },


    tarde: {

        "Grupo A": [
            "Fúrias do Norte",
            "Gigantes da Ilha",
            "Reis Implacáveis",
            "Garras de Neve"
        ],

        "Grupo B": [
            "Garras de Ouro",
            "Lanças do Mar",
            "Ecos da Sombra"
        ],

        "Grupo C": [
            "Ferrões de Fogo",
            "Mestres Astutos",
            "Ilusionistas"
        ]
    }

};


// =========================================================
// QUANTIDADE DE CLASSIFICADOS
// =========================================================

const classificados = {

    manha: {

        "Grupo A": 1,
        "Grupo B": 1,
        "Grupo C": 1,
        "Grupo D": 1

    },

    tarde: {

        "Grupo A": 2,
        "Grupo B": 1,
        "Grupo C": 1

    }

};


// =========================================================
// DADOS ATUAIS
// =========================================================

let dadosAtuais = {};


// =========================================================
// FUNÇÃO PARA CRIAR ID SEGURO
// =========================================================

function idSeguro(texto) {

    return texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9]/g, "-")
        .toLowerCase();
}


// =========================================================
// ID DO JOGO
// =========================================================

function criarIdJogo(time1, time2) {

    return `${idSeguro(time1)}_x_${idSeguro(time2)}`;

}


// =========================================================
// CRIAR INTERFACE
// =========================================================

function criarInterface() {

    const app = document.getElementById("app");

    let html = "";


    // =====================================================
    // MANHÃ E TARDE
    // =====================================================

    for (const periodo of ["manha", "tarde"]) {

        const titulo =
            periodo === "manha"
                ? "🌅 Jogos da Manhã"
                : "🌇 Jogos da Tarde";


        html += `
            <section>

                <h2>${titulo}</h2>
        `;


        // =================================================
        // GRUPOS
        // =================================================

        for (const grupoNome in campeonato[periodo]) {

            const grupoId =
                `${periodo}-${idSeguro(grupoNome)}`;


            html += `

                <div class="grupo">

                    <h3>${grupoNome}</h3>

                    <div
                        class="jogos"
                        id="jogos-${grupoId}">
                    </div>


                    <div class="classificacao">

                        <h3 class="classificacao-titulo">
                            Classificação
                        </h3>


                        <table>

                            <thead>

                                <tr>

                                    <th>Pos.</th>

                                    <th>Equipe</th>

                                    <th>J</th>

                                    <th>V</th>

                                    <th>D</th>

                                    <th>PTS</th>

                                    <th>Saldo</th>

                                    <th>Torcida</th>

                                    <th>Total</th>

                                </tr>

                            </thead>


                            <tbody
                                id="tabela-${grupoId}">
                            </tbody>

                        </table>


                        <div class="legenda">

                            PTS = pontos das partidas |
                            Saldo = pontos feitos - sofridos |
                            Total = PTS + torcida

                        </div>

                    </div>

                </div>

            `;
        }


        html += `
            </section>
        `;
    }


    app.innerHTML = html;


    criarJogos();

}


// =========================================================
// CRIAR JOGOS
// =========================================================

function criarJogos() {

    for (const periodo of ["manha", "tarde"]) {

        for (const grupoNome in campeonato[periodo]) {

            const times =
                campeonato[periodo][grupoNome];


            const grupoId =
                `${periodo}-${idSeguro(grupoNome)}`;


            const container =
                document.getElementById(
                    `jogos-${grupoId}`
                );


            let html = "";


            // =============================================
            // TODAS AS COMBINAÇÕES
            // =============================================

            for (
                let i = 0;
                i < times.length;
                i++
            ) {

                for (
                    let j = i + 1;
                    j < times.length;
                    j++
                ) {

                    const time1 = times[i];

                    const time2 = times[j];


                    const jogoId =
                        criarIdJogo(
                            time1,
                            time2
                        );


                    html += `

                        <div
                            class="jogo"
                            data-jogo="${jogoId}">

                            <div class="jogo-header">


                                <span class="time">
                                    ${time1}
                                </span>


                                <div class="placar">

                                    <input
                                        type="number"
                                        min="0"
                                        step="1"
                                        class="placar1"

                                        data-periodo="${periodo}"

                                        data-grupo="${grupoNome}"

                                        data-time1="${time1}"

                                        data-time2="${time2}"

                                        aria-label="Pontos ${time1}"
                                    >


                                    <span class="vs">
                                        ×
                                    </span>


                                    <input
                                        type="number"
                                        min="0"
                                        step="1"
                                        class="placar2"

                                        data-periodo="${periodo}"

                                        data-grupo="${grupoNome}"

                                        data-time1="${time1}"

                                        data-time2="${time2}"

                                        aria-label="Pontos ${time2}"
                                    >

                                </div>


                                <span
                                    class="time time-direita">

                                    ${time2}

                                </span>


                            </div>


                            <div
                                class="status"
                                id="status-${jogoId}">
                            </div>

                        </div>

                    `;
                }
            }


            container.innerHTML = html;

        }
    }


    adicionarEventosPlacar();

}


// =========================================================
// EVENTOS DOS INPUTS
// =========================================================

function adicionarEventosPlacar() {

    document
        .querySelectorAll(
            ".placar1, .placar2"
        )
        .forEach(input => {

            input.addEventListener(
                "change",
                salvarPlacar
            );

        });

}


// =========================================================
// SALVAR PLACAR
// =========================================================

async function salvarPlacar(event) {

    const input = event.target;


    const periodo =
        input.dataset.periodo;


    const grupo =
        input.dataset.grupo;


    const time1 =
        input.dataset.time1;


    const time2 =
        input.dataset.time2;


    const jogoId =
        criarIdJogo(
            time1,
            time2
        );


    const jogoElement =
        document.querySelector(
            `[data-jogo="${jogoId}"]`
        );


    const input1 =
        jogoElement.querySelector(
            ".placar1"
        );


    const input2 =
        jogoElement.querySelector(
            ".placar2"
        );


    const valor1 =
        input1.value.trim();


    const valor2 =
        input2.value.trim();


    // =====================================================
    // APAGAR RESULTADO
    // =====================================================

    if (
        valor1 === "" &&
        valor2 === ""
    ) {

        await remove(
            ref(
                db,
                `volei_2026/${periodo}/${idSeguro(grupo)}/${jogoId}`
            )
        );

        return;

    }


    // =====================================================
    // UM CAMPO VAZIO
    // =====================================================

    if (
        valor1 === "" ||
        valor2 === ""
    ) {

        mostrarStatus(
            jogoId,
            "Informe os dois placares."
        );

        return;

    }


    const pontos1 =
        Number(valor1);


    const pontos2 =
        Number(valor2);


    // =====================================================
    // VALIDAR NÚMEROS
    // =====================================================

    if (
        !Number.isInteger(pontos1) ||
        !Number.isInteger(pontos2) ||
        pontos1 < 0 ||
        pontos2 < 0
    ) {

        mostrarStatus(
            jogoId,
            "Digite números inteiros positivos."
        );

        return;

    }


    // =====================================================
    // NÃO PERMITIR EMPATE
    // =====================================================

    if (
        pontos1 === pontos2
    ) {

        mostrarStatus(
            jogoId,
            "A partida não pode terminar empatada."
        );

        return;

    }


    // =====================================================
    // SALVAR
    // =====================================================

    try {

        await set(

            ref(
                db,
                `volei_2026/${periodo}/${idSeguro(grupo)}/${jogoId}`
            ),

            {

                time1,

                time2,

                pontos1,

                pontos2

            }

        );


        mostrarStatus(
            jogoId,
            "Resultado salvo ✓"
        );


    } catch (error) {

        console.error(error);


        mostrarStatus(
            jogoId,
            "Erro ao salvar resultado."
        );

    }

}


// =========================================================
// STATUS DO JOGO
// =========================================================

function mostrarStatus(
    jogoId,
    mensagem
) {

    const elemento =
        document.getElementById(
            `status-${jogoId}`
        );


    if (!elemento) {
        return;
    }


    elemento.textContent =
        mensagem;


    setTimeout(() => {

        elemento.textContent = "";

    }, 2500);

}


// =========================================================
// TORCIDA
// =========================================================

async function alterarTorcida(
    periodo,
    grupo,
    time,
    quantidade
) {

    const atual =
        dadosAtuais
            ?. [periodo]
            ?. torcida
            ?. [idSeguro(grupo)]
            ?. [idSeguro(time)]
        || 0;


    const novoValor =
        Math.max(
            0,
            atual + quantidade
        );


    try {

        await set(

            ref(
                db,
                `volei_2026/${periodo}/torcida/${idSeguro(grupo)}/${idSeguro(time)}`
            ),

            novoValor

        );

    } catch (error) {

        console.error(error);


        alert(
            "Não foi possível atualizar a torcida."
        );

    }

}


window.alterarTorcida =
    alterarTorcida;


// =========================================================
// CALCULAR CLASSIFICAÇÃO
// =========================================================

function calcularClassificacao(
    periodo,
    grupo,
    times
) {

    const jogos =
        dadosAtuais
            ?. [periodo]
            ?. [idSeguro(grupo)]
        || {};


    const torcida =
        dadosAtuais
            ?. [periodo]
            ?. torcida
            ?. [idSeguro(grupo)]
        || {};


    const stats = {};


    // =====================================================
    // INICIALIZAR TIMES
    // =====================================================

    times.forEach(time => {

        stats[time] = {

            jogos: 0,

            vitorias: 0,

            derrotas: 0,

            pontos: 0,

            feitos: 0,

            sofridos: 0,

            saldo: 0,

            torcida:
                torcida[
                    idSeguro(time)
                ] || 0

        };

    });


    // =====================================================
    // PROCESSAR JOGOS
    // =====================================================

    Object.values(jogos)
        .forEach(jogo => {

            if (
                !jogo ||
                !Number.isInteger(
                    jogo.pontos1
                ) ||
                !Number.isInteger(
                    jogo.pontos2
                )
            ) {

                return;

            }


            const t1 =
                jogo.time1;


            const t2 =
                jogo.time2;


            const p1 =
                jogo.pontos1;


            const p2 =
                jogo.pontos2;


            if (
                !stats[t1] ||
                !stats[t2]
            ) {

                return;

            }


            // Jogos
            stats[t1].jogos++;

            stats[t2].jogos++;


            // Pontos feitos
            stats[t1].feitos += p1;

            stats[t2].feitos += p2;


            // Pontos sofridos
            stats[t1].sofridos += p2;

            stats[t2].sofridos += p1;


            // Vitória
            if (p1 > p2) {

                stats[t1].vitorias++;

                stats[t1].pontos += 3;

                stats[t2].derrotas++;

            } else {

                stats[t2].vitorias++;

                stats[t2].pontos += 3;

                stats[t1].derrotas++;

            }

        });


    // =====================================================
    // SALDO E TOTAL
    // =====================================================

    times.forEach(time => {

        stats[time].saldo =
            stats[time].feitos -
            stats[time].sofridos;


        stats[time].total =
            stats[time].pontos +
            stats[time].torcida;

    });


    // =====================================================
    // RANKING
    // =====================================================

    const ranking =
        times
            .map(time => ({

                nome: time,

                ...stats[time]

            }))
            .sort((a, b) => {


                // 1º TOTAL

if (
    b.total !==
    a.total
) {

    return (
        b.total -
        a.total
    );

}


// 2º SALDO

if (
    b.saldo !==
    a.saldo
) {

    return (
        b.saldo -
        a.saldo
    );

}


// 3º PTS

if (
    b.pontos !==
    a.pontos
) {

    return (
        b.pontos -
        a.pontos
    );

}


// 4º TORCIDA

if (
    b.torcida !==
    a.torcida
) {

    return (
        b.torcida -
        a.torcida
    );

}
    return ranking;

}


// =========================================================
// ATUALIZAR TABELAS
// =========================================================

function atualizarTabelas() {

    for (
        const periodo
        of ["manha", "tarde"]
    ) {

        for (
            const grupoNome
            in campeonato[periodo]
        ) {

            const times =
                campeonato[periodo][grupoNome];


            const ranking =
                calcularClassificacao(
                    periodo,
                    grupoNome,
                    times
                );


            const quantidadeClassificados =
                classificados
                    [periodo]
                    [grupoNome];


            const tabelaId =
                `tabela-${periodo}-${idSeguro(grupoNome)}`;


            const tbody =
                document.getElementById(
                    tabelaId
                );


            if (!tbody) {
                continue;
            }


            tbody.innerHTML =

                ranking
                    .map((time, index) => {

                        const posicao =
                            index + 1;


                        const classificado =
                            posicao <=
                            quantidadeClassificados;


                        const saldoFormatado =
                            time.saldo > 0
                                ? `+${time.saldo}`
                                : time.saldo;


                        return `

                            <tr class="${
                                classificado
                                    ? "classificado"
                                    : ""
                            }">

                                <td>
                                    ${posicao}º
                                </td>


                                <td>
                                    ${time.nome}
                                </td>


                                <td>
                                    ${time.jogos}
                                </td>


                                <td>
                                    ${time.vitorias}
                                </td>


                                <td>
                                    ${time.derrotas}
                                </td>


                                <td>
                                    ${time.pontos}
                                </td>


                                <td>
                                    ${saldoFormatado}
                                </td>


                                <td>

                                    <strong>
                                        ${time.torcida}
                                    </strong>


                                    <div
                                        class="torcida-buttons">

                                        <button
                                            class="btn-torcida btn-menos"

                                            onclick="
                                                alterarTorcida(
                                                    '${periodo}',
                                                    '${grupoNome}',
                                                    '${time.nome}',
                                                    -1
                                                )
                                            "
                                        >
                                            −
                                        </button>


                                        <button
                                            class="btn-torcida btn-mais"

                                            onclick="
                                                alterarTorcida(
                                                    '${periodo}',
                                                    '${grupoNome}',
                                                    '${time.nome}',
                                                    1
                                                )
                                            "
                                        >
                                            +1
                                        </button>

                                    </div>

                                </td>


                                <td>
                                    <strong>
                                        ${time.total}
                                    </strong>
                                </td>

                            </tr>

                        `;

                    })
                    .join("");

        }

    }

}


// =========================================================
// ATUALIZAR INPUTS
// =========================================================

function atualizarInputs() {

    for (
        const periodo
        of ["manha", "tarde"]
    ) {

        for (
            const grupoNome
            in campeonato[periodo]
        ) {

            const jogos =
                dadosAtuais
                    ?. [periodo]
                    ?. [idSeguro(grupoNome)]
                || {};


            Object.values(jogos)
                .forEach(jogo => {

                    if (!jogo) {
                        return;
                    }


                    const jogoId =
                        criarIdJogo(
                            jogo.time1,
                            jogo.time2
                        );


                    const elemento =
                        document.querySelector(
                            `[data-jogo="${jogoId}"]`
                        );


                    if (!elemento) {
                        return;
                    }


                    const input1 =
                        elemento.querySelector(
                            ".placar1"
                        );


                    const input2 =
                        elemento.querySelector(
                            ".placar2"
                        );


                    if (
                        document.activeElement !==
                        input1
                    ) {

                        input1.value =
                            jogo.pontos1 ?? "";

                    }


                    if (
                        document.activeElement !==
                        input2
                    ) {

                        input2.value =
                            jogo.pontos2 ?? "";

                    }

                });

        }

    }

}


// =========================================================
// FIREBASE EM TEMPO REAL
// =========================================================

onValue(
    rootRef,
    snapshot => {

        dadosAtuais =
            snapshot.val() || {};


        atualizarInputs();

        atualizarTabelas();

    },
    error => {
        console.error("Erro ao carregar Firebase:", error);
        const app = document.getElementById("app");
        if (app) {
            app.innerHTML = `<div class="carregando">Erro ao carregar o banco de dados.<br><small>${error?.message || "Verifique a internet e as regras do Firebase Realtime Database."}</small></div>`;
        }
    }
);

function obterGruposParaImpressao() {
    return Array.from(document.querySelectorAll(".grupo")).map((grupo, index) => {
        const titulo = grupo.querySelector(":scope > h3")?.textContent?.trim()
            || `Grupo ${index + 1}`;
        const classificacao = grupo.querySelector(":scope > .classificacao");
        const tabela = classificacao?.querySelector("table");

        return {
            index,
            nome: titulo.replace(/\\s+/g, " ").trim(),
            grupo,
            tabela,
            classificacao
        };
    }).filter(item => item.tabela);
}

function atualizarContadorImpressao() {
    const checks = document.querySelectorAll(".checkbox-tabela-impressao");
    const quantidade = Array.from(checks).filter(check => check.checked).length;
    const contador = document.getElementById("contadorTabelasSelecionadas");
    const botao = document.getElementById("btnImprimirSelecionadas");

    if (contador) {
        contador.textContent = quantidade === 1
            ? "1 tabela selecionada"
            : `${quantidade} tabelas selecionadas`;
    }

    if (botao) {
        botao.disabled = quantidade === 0;
    }
}

function fecharModalImpressao() {
    const modal = document.getElementById("modalImpressaoTabelas");
    if (!modal) return;

    modal.classList.remove("aberta");
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-impressao-aberta");
}

function abrirImpressaoTabelas() {
    const modal = document.getElementById("modalImpressaoTabelas");
    const lista = document.getElementById("listaTabelasImpressao");

    if (!modal || !lista) {
        console.error("Modal de impressão não encontrada no HTML.");
        return;
    }

    const grupos = obterGruposParaImpressao();
    lista.innerHTML = "";

    if (!grupos.length) {
        lista.innerHTML = `
            <div class="impressao-vazia">
                Nenhuma tabela de classificação foi encontrada.
            </div>
        `;
    } else {
        grupos.forEach(item => {
            const label = document.createElement("label");
            label.className = "item-tabela-impressao";
            label.innerHTML = `
                <input type="checkbox" class="checkbox-tabela-impressao" data-index="${item.index}">
                <span class="item-tabela-texto">
                    <strong>${item.nome}</strong>
                    <small>Selecionar esta tabela para impressão</small>
                </span>
            `;
            lista.appendChild(label);
        });
    }

    modal.classList.add("aberta");
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-impressao-aberta");
    atualizarContadorImpressao();
}

function imprimirTabelasSelecionadas() {
    const grupos = obterGruposParaImpressao();
    const selecionados = Array.from(document.querySelectorAll(".checkbox-tabela-impressao"))
        .filter(check => check.checked)
        .map(check => grupos[Number(check.dataset.index)])
        .filter(Boolean);

    if (!selecionados.length) {
        alert("Selecione pelo menos uma tabela para imprimir.");
        return;
    }

    const blocos = selecionados.map(item => {
        const tabela = item.tabela.cloneNode(true);

        tabela.querySelectorAll("button, input, select, .torcida-buttons, .btn-torcida").forEach(el => el.remove());

        const classificados = Array.from(item.tabela.querySelectorAll("tbody tr.classificado"))
            .map(tr => tr.children[1]?.textContent?.trim())
            .filter(Boolean);

        const classificadosHtml = classificados.length
            ? `<div class="classificados-impressao">
                    <strong>🏆 Times classificados</strong>
                    <div>${classificados.join(" • ")}</div>
               </div>`
            : "";

        return `
            <section class="bloco-impressao">
                <h2>${item.nome}</h2>
                ${tabela.outerHTML}
                ${classificadosHtml}
            </section>
        `;
    }).join("");

    const janela = window.open("", "_blank", "width=1100,height=800");

    if (!janela) {
        alert("O navegador bloqueou a janela de impressão. Permita pop-ups para este site.");
        return;
    }

    janela.document.open();
    janela.document.write(`<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Interclasse de Vôlei 2026 - Tabelas</title>
<style>
@page { margin: 12mm; }
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; color: #111; margin: 0; }
h1 { text-align: center; margin: 0 0 26px; }
.bloco-impressao { page-break-inside: avoid; break-inside: avoid; margin-bottom: 32px; }
.bloco-impressao h2 { margin: 0 0 10px; padding-bottom: 7px; border-bottom: 2px solid #222; font-size: 21px; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #777; padding: 7px 8px; text-align: center; }
th { background: #eee !important; color: #111 !important; }
td:nth-child(2) { text-align: left; font-weight: 600; }
.classificados-impressao { margin-top: 10px; padding: 9px 11px; border: 1px solid #777; }
.classificados-impressao strong { display: block; margin-bottom: 4px; }
button, input, select, .torcida-buttons { display: none !important; }
</style>
</head>
<body>
<h1>🏐 Interclasse de Vôlei 2026</h1>
${blocos}
</body>

    janela.document.close();

    setTimeout(() => {
        janela.focus();
        janela.print();
    }, 300);
}

document.addEventListener("click", event => {

<script>
document.addEventListener("DOMContentLoaded", function () {
    const fechar = () => fecharModalImpressao();
    document.getElementById("fecharModalImpressao")?.addEventListener("click", fechar);
    document.getElementById("cancelarModalImpressao")?.addEventListener("click", fechar);
    document.getElementById("fecharModalImpressaoOverlay")?.addEventListener("click", fechar);
    document.getElementById("selecionarTodasTabelas")?.addEventListener("click", function () {
        document.querySelectorAll(".checkbox-tabela-impressao").forEach(c => c.checked = true);
        atualizarContadorImpressao();
    });

    });

    });
});
